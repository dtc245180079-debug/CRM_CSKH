services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: CrmSecurePassword2026!
      POSTGRES_DB: crm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crm_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crm.com
      PGADMIN_DEFAULT_PASSWORD: PgAdminSecurePass2026!
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    networks:
      - crm_net
    depends_on:
      - postgres

  crm_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: crm_app
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_USER: crm_user
      DB_PASSWORD: CrmSecurePassword2026!
      DB_NAME: crm_db
    networks:
      - crm_net
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - crm_net
    depends_on:
      - crm_app

  prometheus:
    image: prom/prometheus:latest
    container_name: crm_prometheus
    restart: unless-stopped
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - crm_net
    depends_on:
      - crm_app

  loki:
    image: grafana/loki:latest
    container_name: crm_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crm_net

  promtail:
    image: grafana/promtail:latest
    container_name: crm_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - crm_net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: crm_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - crm_net
    depends_on:
      - prometheus
      - loki

networks:
  crm_net:
    driver: bridge

volumes:
  pgdata:
  grafana_data: